name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # in a real repo this would `needs: [test]` from ci.yml via workflow_run
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin your-registry.example.com
          docker build -t your-registry.example.com/mcp-saas-platform:${{ github.sha }} ./server
          docker push your-registry.example.com/mcp-saas-platform:${{ github.sha }}

      - name: Deploy to server (SSH)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull your-registry.example.com/mcp-saas-platform:${{ github.sha }}
            docker stop mcp-server || true
            docker rm mcp-server || true
            docker run -d --name mcp-server \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -p 8000:8000 \
              your-registry.example.com/mcp-saas-platform:${{ github.sha }}
